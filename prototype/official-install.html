<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pakkit — 开源软件原型</title>
<style>
:root {
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f7f8fa; --surface-3:#eceef2;
  --line:#e3e6eb; --line-strong:#cfd4dc; --ink:#14171c; --ink-2:#40474f;

.dark {

  --warn:#fbbf24; --danger:#f87171; --scrollbar:#333a46;

* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:13px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,"Microsoft YaHei UI",sans-serif; overflow:hidden; }
button,input,select,textarea { font:inherit; }
button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
a { color:inherit; text-decoration:none; }
svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.85; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.hidden { display:none!important; }
.app { height:100vh; display:flex; flex-direction:column; }
.titlebar { height:52px; flex-shrink:0; display:flex; align-items:center; gap:20px; padding-left:14px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--surface) 82%,transparent); }
.brand { display:flex; align-items:center; gap:10px; min-width:194px; }

.brand-mark svg { width:15px; }
.brand-name { font-size:13px; font-weight:650; }

.global-search { height:34px; width:min(480px,45vw); margin:auto; display:flex; align-items:center; gap:8px; padding:0 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); color:var(--muted); }

.nav { display:flex; flex-direction:column; gap:2px; }
.nav-item { height:38px; display:flex; align-items:center; gap:11px; position:relative; padding:0 10px; border:0; border-radius:9px; color:var(--ink-2); background:transparent; text-align:left; white-space:nowrap; }
.nav-item:hover { background:var(--surface-3); color:var(--ink); }
.nav-item.active { color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent); font-weight:600; }
.nav-item.active::before { content:""; position:absolute; left:-8px; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
.nav-item svg { width:17px; height:17px; }
.sidebar-footer { margin-top:auto; padding-top:8px; border-top:1px solid var(--line); }
.queue-count { margin-left:auto; min-width:19px; height:19px; display:grid; place-items:center; border-radius:10px; background:var(--accent); color:var(--on-accent); font-size:10px; }
.main { min-width:0; flex:1; display:flex; flex-direction:column; }
.content { flex:1; overflow-y:auto; padding:24px 26px 36px; scroll-behavior:smooth; }
.page-head { display:flex; align-items:center; gap:16px; margin-bottom:18px; }
.page-title { margin:0; font-size:23px; line-height:1.25; letter-spacing:-.4px; }
.page-subtitle { margin:5px 0 0; color:var(--muted); font-size:12px; }
.head-actions { margin-left:auto; display:flex; gap:8px; }
.btn { height:34px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 13px; border-radius:9px; border:1px solid transparent; font-size:12px; font-weight:550; white-space:nowrap; transition:.15s; }
.btn svg { width:14px; height:14px; }
.btn-primary { color:var(--on-accent); background:var(--accent); }
.btn-primary:hover { filter:brightness(1.08); }
.btn-soft { color:var(--ink); background:var(--surface-3); border-color:var(--line); }
.btn-soft:hover,.btn-outline:hover { border-color:var(--line-strong); background:var(--surface-3); }
.btn-outline { color:var(--ink-2); background:transparent; border-color:var(--line-strong); }
.btn-sm { height:29px; padding:0 10px; border-radius:8px; font-size:11px; }
.trust-banner { display:flex; align-items:center; gap:15px; padding:16px 18px; margin-bottom:16px; border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line)); border-radius:13px; background:linear-gradient(105deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 58%); }
.trust-icon { width:40px; height:40px; flex-shrink:0; display:grid; place-items:center; border-radius:11px; color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,transparent); }
.trust-icon svg { width:21px; height:21px; }
.trust-title { margin:0 0 3px; font-size:13px; font-weight:650; }
.trust-copy { margin:0; color:var(--ink-2); font-size:11.5px; }
.trust-points { margin-left:auto; display:flex; gap:18px; color:var(--muted); font-size:11px; white-space:nowrap; }
.trust-points span { display:flex; align-items:center; gap:5px; }
.trust-points svg { width:13px; height:13px; color:var(--ok); }
.filters { display:flex; align-items:center; gap:9px; margin-bottom:16px; }
.search-box { height:38px; min-width:200px; flex:1; display:flex; align-items:center; gap:9px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--muted); }
.search-box:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent); }
.search-box svg { width:16px; }
.search-box input { min-width:0; width:100%; border:0; outline:0; color:var(--ink); background:transparent; font-size:12px; }
.search-box input::placeholder { color:var(--muted); }
.select-wrap { height:38px; display:flex; align-items:center; gap:7px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--muted); }
.select-wrap svg { width:15px; }
select { border:0; outline:0; color:var(--ink-2); background:transparent; font-size:12px; cursor:pointer; }
select option { background:var(--surface); color:var(--ink); }
.categories { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:23px; }
.category { height:31px; display:flex; align-items:center; gap:6px; padding:0 11px; border:1px solid var(--line); border-radius:8px; color:var(--ink-2); background:var(--surface); font-size:11.5px; }
.category:hover { border-color:var(--line-strong); }
.category.active { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 38%,var(--line)); background:color-mix(in srgb,var(--accent) 10%,var(--surface)); font-weight:600; }
.category .count { color:var(--muted); font-size:10px; }
.section { margin-bottom:24px; scroll-margin-top:12px; }
.section-head { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
.section-icon { color:var(--section-color,var(--accent)); display:grid; place-items:center; }
.section-icon svg { width:17px; height:17px; }
.section-title { margin:0; font-size:14px; font-weight:650; }
.section-count { color:var(--muted); font-size:11px; }
.section-desc { margin-left:4px; color:var(--muted); font-size:11px; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
.card { min-width:0; display:flex; flex-direction:column; padding:15px; border:1px solid var(--line); border-radius:13px; background:var(--surface); transition:border-color .16s,transform .16s,box-shadow .16s; }
.card:hover { transform:translateY(-1px); border-color:color-mix(in srgb,var(--accent) 38%,var(--line)); box-shadow:0 10px 24px -20px color-mix(in srgb,var(--accent) 65%,transparent); }
.card-head { display:flex; align-items:center; gap:10px; }
.app-logo { width:42px; height:42px; flex-shrink:0; display:grid; place-items:center; border:1px solid color-mix(in srgb,var(--logo) 22%,var(--line)); border-radius:11px; color:var(--logo); background:color-mix(in srgb,var(--logo) 12%,var(--surface)); font-size:17px; font-weight:750; letter-spacing:-.5px; }
.app-logo svg { width:22px; height:22px; }
.app-name { min-width:0; flex:1; }
.app-title { display:flex; align-items:center; gap:7px; }
.app-title h3 { overflow:hidden; margin:0; font-size:13.5px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
.publisher { margin-top:2px; color:var(--muted); font-size:10.5px; }
.official { margin-left:auto; align-self:flex-start; display:flex; align-items:center; gap:3px; padding:3px 5px; border-radius:5px; color:var(--ok); background:color-mix(in srgb,var(--ok) 10%,transparent); font-size:9.5px; white-space:nowrap; }
.official svg { width:10px; height:10px; }
.app-desc { min-height:36px; margin:12px 0 11px; color:var(--ink-2); font-size:11.5px; line-height:1.6; }
.method { display:flex; align-items:center; gap:6px; padding:8px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink-2); font-size:10.5px; }
.method svg { width:13px; height:13px; color:var(--muted); }
.method .meta { margin-left:auto; color:var(--muted); }
.method .admin { color:var(--warn); }
.install-status { flex-shrink:0; display:inline-flex; align-items:center; gap:3px; color:var(--muted); font-size:9.5px; }
.install-status::before { content:""; width:5px; height:5px; flex-shrink:0; border-radius:50%; background:var(--muted); }
.install-status.installed { color:var(--ok); }
.install-status.installed::before { background:var(--ok); }
.install-status svg { width:12px; height:12px; }
.card-foot { display:flex; align-items:center; margin-top:12px; }
.detail-link { display:inline-flex; align-items:center; gap:4px; padding:3px 0; border:0; color:var(--muted); background:transparent; font-size:11px; }
.detail-link:hover { color:var(--accent); }
.detail-link svg { width:12px; height:12px; }
.card-foot .btn { margin-left:auto; }
.statusbar { height:28px; flex-shrink:0; display:flex; align-items:center; gap:15px; padding:0 12px; border-top:1px solid var(--line); color:var(--muted); background:var(--surface); font-size:10.5px; }
.statusbar .ready { display:flex; align-items:center; gap:6px; }
.statusbar .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); }
.statusbar .arch { margin-left:auto; padding:0 6px; border:1px solid var(--line); border-radius:4px; background:var(--surface-3); }
.empty { padding:60px 20px; text-align:center; color:var(--muted); }
.empty svg { width:28px; height:28px; margin-bottom:10px; }
.empty h3 { margin:0 0 5px; color:var(--ink); font-size:15px; }
.backdrop { position:fixed; inset:0; z-index:60; background:rgba(3,5,9,.58); backdrop-filter:blur(3px); }
.modal { position:fixed; z-index:70; top:50%; left:50%; width:min(650px,calc(100vw - 40px)); max-height:calc(100vh - 48px); transform:translate(-50%,-50%); display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 24px 60px -20px rgba(0,0,0,.6); }
.modal-head { display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }
.modal-head h2 { margin:0; font-size:16px; }
.modal-head p { margin:3px 0 0; color:var(--muted); font-size:11px; }
.icon-btn { width:29px; height:29px; display:grid; place-items:center; border:0; border-radius:8px; color:var(--muted); background:transparent; }
.icon-btn:hover { color:var(--ink); background:var(--surface-3); }
.modal-head .icon-btn { margin-left:auto; }
.modal-body { overflow-y:auto; padding:18px 20px; }
.detail-meta { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:15px; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:4px 7px; border:1px solid var(--line); border-radius:6px; color:var(--ink-2); background:var(--surface-2); font-size:10px; }
.badge svg { width:11px; height:11px; }
.source-row { display:flex; align-items:center; gap:8px; padding:10px 12px; margin-bottom:8px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
.source-row svg { width:15px; color:var(--ok); }
.source-row span { flex-shrink:0; min-width:86px; color:var(--muted); font-size:11px; }
.source-row a { overflow:hidden; color:var(--accent); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
.source-row .open { margin-left:auto; color:var(--muted); }
.field-label { display:block; margin:13px 0 6px; color:var(--ink-2); font-size:11px; font-weight:600; }
.detail-select { width:100%; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); }
.command-box { overflow:hidden; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
.command-top { display:flex; align-items:center; padding:6px 9px; border-bottom:1px solid var(--line); color:var(--muted); font-size:10px; }
.copy-btn { margin-left:auto; display:flex; align-items:center; gap:4px; padding:2px 4px; border:0; color:var(--muted); background:transparent; font-size:10px; }
.copy-btn:hover { color:var(--accent); }
.copy-btn svg { width:11px; height:11px; }
.command { overflow-x:auto; margin:0; padding:12px; color:var(--ink-2); font:11px/1.7 "Cascadia Code",Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; user-select:text; }
.note { display:flex; align-items:flex-start; gap:8px; margin-top:13px; padding:10px 11px; border-radius:8px; color:var(--ink-2); background:color-mix(in srgb,var(--warn) 8%,var(--surface)); font-size:11px; }
.note svg { width:14px; height:14px; margin-top:1px; color:var(--warn); }
.modal-foot { display:flex; align-items:center; gap:8px; padding:13px 20px; border-top:1px solid var(--line); background:var(--surface-2); }
.modal-foot .footnote { margin-right:auto; color:var(--muted); font-size:10px; }
.form-input { width:100%; height:38px; padding:0 11px; border:1px solid var(--line); border-radius:8px; outline:0; color:var(--ink); background:var(--surface-2); }
textarea.form-input { height:80px; padding:9px 11px; resize:vertical; }
.form-error { margin:12px 0 0; padding:9px 11px; border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line)); border-radius:8px; color:var(--danger); background:color-mix(in srgb,var(--danger) 8%,var(--surface)); font-size:11px; }
.form-input:focus { border-color:var(--accent); }
.drawer { position:fixed; z-index:50; top:52px; right:0; bottom:28px; width:340px; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--surface); box-shadow:-18px 0 50px -30px rgba(0,0,0,.5); }
.drawer-head { display:flex; align-items:center; gap:8px; padding:14px; border-bottom:1px solid var(--line); }
.drawer-head h2 { margin:0; font-size:14px; }
.drawer-head .icon-btn { margin-left:auto; }
.queue-list { padding:12px; overflow-y:auto; }
.queue-empty { padding:55px 15px; text-align:center; color:var(--muted); font-size:12px; }
.queue-empty svg { width:28px; height:28px; margin-bottom:9px; }
.queue-item { margin-bottom:9px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); }
.queue-item-head { display:flex; align-items:center; gap:8px; }
.queue-item-head strong { font-size:12px; }
.queue-item-head span { margin-left:auto; color:var(--muted); font-size:10px; }
.queue-command { overflow:hidden; margin:9px 0; color:var(--muted); font:10px Consolas,monospace; text-overflow:ellipsis; white-space:nowrap; }
.pending-bar { height:5px; border-radius:5px; background:repeating-linear-gradient(90deg,var(--surface-3) 0,var(--surface-3) 14px,color-mix(in srgb,var(--accent) 22%,var(--surface-3)) 14px,color-mix(in srgb,var(--accent) 22%,var(--surface-3)) 20px); }
@keyframes progress { from{transform:translateX(-100%)} to{transform:translateX(350%)} }
.toast-root { position:fixed; z-index:100; right:18px; bottom:42px; display:flex; flex-direction:column; gap:8px; }
.toast { max-width:360px; display:flex; align-items:center; gap:8px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; color:var(--ink-2); background:var(--surface); box-shadow:0 15px 40px -18px rgba(0,0,0,.6); font-size:12px; animation:toast-in .2s ease-out; }
.toast svg { width:15px; color:var(--ok); }
@keyframes toast-in { from{opacity:0;transform:translateY(5px)} }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { border:3px solid transparent; border-radius:10px; background:var(--scrollbar); background-clip:content-box; }
@media (min-width:1500px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
@media (max-width:1180px) {
  .sidebar { width:64px; } .nav-item { justify-content:center; padding:0; } .nav-item span:not(.queue-count) { display:none; }
  .nav-item.active::before { display:none; } .queue-count { position:absolute; top:1px; right:3px; min-width:15px; height:15px; font-size:8px; }
  .brand { min-width:150px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .trust-points { display:none; }
}
@media (max-width:760px) {
  .global-search,.window-controls,.prototype-badge { display:none; } .titlebar { padding-left:12px; } .brand { min-width:0; }
  .content { padding:18px 15px 30px; } .page-head { align-items:flex-start; } .head-actions .btn-soft { display:none; }
  .trust-banner { padding:12px; } .trust-copy { font-size:10.5px; } .grid { grid-template-columns:1fr; }
  .filters { flex-wrap:wrap; } .search-box { flex-basis:100%; } .section-desc { display:none; }

@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
</style>

function renderCatalog() {

    if (!apps.length) return '';

  const value = expression.trim();
  if (!/^[A-Za-z0-9.-]+(?:\s+(?:AND|OR)\s+[A-Za-z0-9.-]+)*$/.test(value)) return false;

}
function openSubmit() {
  $('#modalRoot').innerHTML = `<div class="backdrop" data-close></div><section class="modal" role="dialog" aria-modal="true" aria-labelledby="submitTitle"><div class="modal-head"><div><h2 id="submitTitle">开源软件提交</h2><p>提供可核验的源码、OSI 批准许可证与官方安装文档</p></div><button class="icon-btn" data-close aria-label="关闭">${ico('x')}</button></div><form id="submitForm"><div class="modal-body"><label class="field-label" for="softwareName">软件名称（必填）</label><input class="form-input" id="softwareName" required placeholder="例如：Deno"/><label class="field-label" for="sourceRepository">源码仓库（必填，HTTPS）</label><input class="form-input" id="sourceRepository" type="url" required placeholder="https://github.com/denoland/deno"/><label class="field-label" for="softwareLicense">SPDX 许可证（必填）</label><input class="form-input" id="softwareLicense" required placeholder="例如：MIT OR Apache-2.0"/><label class="field-label" for="licenseUrl">许可证原文（必填，HTTPS）</label><input class="form-input" id="licenseUrl" type="url" required placeholder="https://raw.githubusercontent.com/…/LICENSE"/><label class="field-label" for="softwareUrl">官方安装文档（必填，HTTPS）</label><input class="form-input" id="softwareUrl" type="url" required placeholder="https://…"/><label class="field-label" for="softwareNote">补充说明（可选）</label><textarea class="form-input" id="softwareNote" placeholder="支持的平台、安装方式或收录理由"></textarea><p class="form-error hidden" id="submissionError" role="alert"></p><div class="note">${ico('info')}<span>原型使用有限的 OSI 许可证白名单校验简单 SPDX 表达式；拒绝弃用标识、非 OSI 许可证与 LicenseRef。正式目录仍须人工核对原文。</span></div></div><div class="modal-foot"><button class="btn btn-outline" type="button" data-close>取消</button><button class="btn btn-primary" type="submit">预览提交内容</button></div></form></section>`;
  $$('[data-close]').forEach(el => el.addEventListener('click',closeModal));
  $('#submitForm').addEventListener('submit',e => {
    e.preventDefault();
    const fields = {
      name:$('#softwareName'),repository:$('#sourceRepository'),license:$('#softwareLicense'),
      licenseUrl:$('#licenseUrl'),installUrl:$('#softwareUrl'),
    };
    const fail = (message,field) => {
      const error = $('#submissionError'); error.textContent = message; error.classList.remove('hidden'); field.focus();
    };
    if (!fields.name.value.trim()) return fail('请填写软件名称。',fields.name);
    for (const [field,label] of [[fields.repository,'源码仓库'],[fields.licenseUrl,'许可证原文'],[fields.installUrl,'官方安装文档']]) {
      if (!validHttps(field.value)) return fail(`${label}必须使用有效的 HTTPS 链接。`,field);
    }
    if (!validOpenSourceLicense(fields.license.value)) return fail('SPDX 表达式无效，或包含非 OSI、弃用许可证及 LicenseRef。',fields.license);
    closeModal(); toast('开源证明与 HTTPS 链接已通过本地检查；原型不会实际发送');
  });
  document.addEventListener('keydown',escClose); $('#softwareName').focus();
}
$('#catalogSearch').addEventListener('input',e => { state.query = e.target.value; renderCatalog(); });
$('#globalSearch').addEventListener('input',e => { state.query = e.target.value; $('#catalogSearch').value = state.query; renderCatalog(); });
$('#platformSelect').addEventListener('change',e => { state.platform = e.target.value; updateArchStatus(); renderCatalog(); });
$('#archSelect').addEventListener('change',e => { state.arch = e.target.value; updateArchStatus(); });
$('#refreshBtn').addEventListener('click',() => toast('原型目录已是最新 · 6 款软件'));
$('#submitBtn').addEventListener('click',openSubmit);
$('#queueBtn').addEventListener('click',openQueue);
$('#closeQueue').addEventListener('click',() => $('#queueDrawer').classList.add('hidden'));
$('#themeBtn').addEventListener('click',() => { const dark = document.documentElement.classList.toggle('dark'); $('#themeLabel').textContent = dark ? '深色主题' : '浅色主题'; });
$$('[data-demo]').forEach(btn => btn.addEventListener('click',() => toast(`${btn.dataset.demo}页面不在本次原型范围内`)));
document.addEventListener('keydown',e => { if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#globalSearch').focus(); } });
renderCategories(); renderCatalog(); renderQueue(); updateArchStatus();
</script>
</body>
</html>

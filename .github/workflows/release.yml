name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry-run: exercises every build/package job and uploads artifacts,
  # but the publish job is skipped (gated on the push event below).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and verify tag
        id: v
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          if [ -z "$version" ]; then
            echo "::error::version not found in Cargo.toml"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $zip = "pakkit-$ver-windows-$arch.zip"
          $stage = "dist\stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\pakkit.exe" $stage
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$zip"
          Remove-Item -Recurse -Force $stage

      # cargo-wix bundles WiX 3.x, which cannot emit arm64 MSIs — x86_64 only.
      - name: Install cargo-wix
        if: matrix.arch == 'x86_64'
        run: cargo binstall -y cargo-wix || cargo install cargo-wix --locked

      - name: Build MSI
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: >
          cargo wix --target ${{ matrix.target }}
          --output "dist\pakkit-${{ needs.version.outputs.version }}-windows-x86_64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runs-on: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libfontconfig-dev
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev librsvg2-bin desktop-file-utils

      # Native build without --target so the deb/rpm asset paths
      # (target/release/...) in Cargo.toml metadata stay valid.
      - name: Build
        run: cargo build --release --locked

      - name: Validate desktop entry
        run: desktop-file-validate packaging/pakkit.desktop

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package deb
        run: |
          set -euo pipefail
          cargo deb --locked --no-build
          ver="${{ needs.version.outputs.version }}"
          cp target/debian/pakkit_*_*.deb "dist/pakkit-${ver}-linux-${{ matrix.arch }}.deb"

      - name: Package rpm
        run: |
          set -euo pipefail
          cargo generate-rpm
          ver="${{ needs.version.outputs.version }}"
          cp target/generate-rpm/pakkit-*.rpm "dist/pakkit-${ver}-linux-${{ matrix.arch }}.rpm"

      - name: Package AppImage
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          case "${{ matrix.arch }}" in
            x86_64) A=x86_64 ;;
            arm64)  A=aarch64 ;;
          esac
          curl -sSfL -o linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${A}.AppImage"
          curl -sSfL -o linuxdeploy-plugin-appimage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${A}.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          rsvg-convert -w 256 -h 256 assets/logo.svg -o pakkit.png
          export APPIMAGE_EXTRACT_AND_RUN=1 VERSION="$ver"
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --executable target/release/pakkit \
            --desktop-file packaging/pakkit.desktop \
            --icon-file pakkit.png \
            --plugin appimage \
            --output appimage
          cp Pakkit-*-"${A}".AppImage "dist/pakkit-${ver}-linux-${{ matrix.arch }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build-windows, build-linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Unified checksums
        run: |
          cd dist
          sha256sum pakkit-* > "pakkit-${{ needs.version.outputs.version }}-checksums.txt"

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details." > notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true

[package]
name = "pakkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["vgerbot-app"]
repository = "https://github.com/vgerbot-app/pakkit"
description = "A native multi-backend package manager GUI (winget / Chocolatey / Scoop / Homebrew / apt / dnf / flatpak / pacman / zypper / apk / snap) built with gpui-kit."

[dependencies]
dirs = "6"
gpui-kit = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.46", default-features = false }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.8", features = ["test-support"] }
serde_yaml = "0.9"

# Keep debug runs usable (gpui advice).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

# --- Packaging metadata (used by the release workflow) ---

[package.metadata.deb]
maintainer = "vgerbot-app <noreply@users.noreply.github.com>"
copyright = "MIT"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """
Mainstream package managers unified into one graphical experience — \
from winget to snap, install, update and uninstall in one place. \
Built with Rust + gpui-kit: a real native window, no Electron / WebView.\
"""
assets = [
    ["target/release/pakkit", "usr/bin/pakkit", "755"],
    ["packaging/pakkit.desktop", "usr/share/applications/pakkit.desktop", "644"],
    ["assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/pakkit.svg", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pakkit", dest = "/usr/bin/pakkit", mode = "755" },
    { source = "packaging/pakkit.desktop", dest = "/usr/share/applications/pakkit.desktop", mode = "644" },
    { source = "assets/logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/pakkit.svg", mode = "644" },
]

[package.metadata.wix]
upgrade-guid = "2581990d-124e-47d3-a923-b058feefd705"
path-guid = "a76c9c00-50ba-477b-b9a1-d3c2a3531523"
license = false
eula = false
product-icon = "assets/pakkit.ico"
help-url = "https://github.com/vgerbot-app/pakkit"

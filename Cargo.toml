[package]
name = "pakkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "A native multi-backend package manager GUI (winget / apt / flatpak / pacman / snap) built with gpui-kit."

[dependencies]
dirs = "6"
gpui-kit = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.46", default-features = false }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "0.8", features = ["test-support"] }
serde_yaml = "0.9"

# Keep debug runs usable (gpui advice).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
